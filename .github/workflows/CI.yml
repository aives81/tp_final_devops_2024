name: Continuous Integration Pipeline

on:
  push:
    branches:
      - "main"
      - "develop/*"
  pull_request:
    branches:
      - "main"

jobs:

  api-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v4
        with:
          go-version: 1.23

      - run: |
          cd vote-api
          go mod tidy
          curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/master/install.sh | sh -s -- -b ./bin v1.63.4
          ./bin/golangci-lint run

  api-format:
    runs-on: ubuntu-latest
    needs: api-lint
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v4
        with:
          go-version: 1.23

      - run: |
          cd vote-api
          go fmt ./...

  api-tests:
    runs-on: ubuntu-latest
    needs: api-format
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v4
        with:
          go-version: 1.23

      - run: |
          cd vote-api
          go test ./...

  api-build:
    runs-on: ubuntu-latest
    needs: api-tests
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v4
        with:
          go-version: "1.23"

      - run: |
          cd vote-api
          go build
  push_api_to_registry:
    runs-on: ubuntu-latest
    needs: api-build
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: |
          cd vote-api
          docker image build -t ${{ secrets.DOCKER_USERNAME }}/vote-api:latest -f Dockerfile .

      - name: Push Docker image
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        run: |
          echo $DOCKER_PASSWORD | docker login -u $DOCKER_USERNAME --password-stdin
          docker push $DOCKER_USERNAME/vote-api:latest

  web-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 23

      - run: |
          cd web-client
          yarn install --no-lockfile
          yarn lint

  web-format:
    runs-on: ubuntu-latest
    needs: web-lint
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 23

      - run: |
          cd web-client
          yarn install --no-lockfile
          yarn format:write

  web-check-format:
    runs-on: ubuntu-latest
    needs: web-format
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 23

      - run: |
          cd web-client
          yarn install --no-lockfile
          yarn format:check

  web-build:
    runs-on: ubuntu-latest
    needs: web-check-format
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 23

      - run: |
          cd web-client
          yarn install --no-lockfile
          yarn build

  push_web_to_registry:
    runs-on: ubuntu-latest
    needs: web-build
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: |
          cd web-client
          docker image build -t ${{ secrets.DOCKER_USERNAME }}/web-client:latest -f Dockerfile .

      - name: Push Docker image
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        run: |
          echo $DOCKER_PASSWORD | docker login -u $DOCKER_USERNAME --password-stdin
          docker push $DOCKER_USERNAME/web-client:latest